<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Article Classification System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>📰 News Article Classification</h1>
        <p class="subtitle">Enter a news article to identify its category</p>

        <textarea id="newsText" placeholder="Enter your news article here..."></textarea>

        <div class="buttons">
            <button onclick="classifyNews()">Classify News</button>
            <button onclick="clearText()">Clear</button>
        </div>

        <div class="result">
            <h2>Classification Result</h2>
            <div id="category">Category will appear here</div>
            <p id="description"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
